name: build and release toolchains

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }} for ${{ matrix.host.arch }}
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [arm, armv5, arm6, armv7, aarch64, x86, amd64, mips, mipsel, mips64, mips64el]
        host:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: install Buildroot prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes bc bison build-essential cpio file flex rsync unzip wget
      - name: build and package SDK
        run: ./scripts/build-toolchain.sh "${{ matrix.target }}"
      - name: upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: musl-${{ matrix.target }}-${{ matrix.host.arch }}-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: musl-*-linux
          path: release-assets
          merge-multiple: true
      - name: create aggregate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release-assets/*
          --repo "${{ github.repository }}"
          --generate-notes
          --verify-tag

  build-image:
    name: build container for ${{ matrix.host.platform }}
    needs: build
    runs-on: ${{ matrix.host.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        host:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            platform: linux/amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: download SDKs for this image platform
        uses: actions/download-artifact@v4
        with:
          pattern: musl-*-${{ matrix.host.arch }}-linux
          path: docker-sdks
          merge-multiple: true
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push image by digest
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.host.platform }}
          tags: ghcr.io/${{ github.repository }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
      - name: export image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"
      - name: upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.host.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: publish multi-platform container
    needs: build-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create and verify image manifest
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_VERSION: ${{ github.ref_name }}
        run: |
          sources=()
          for digest_file in image-digests/*; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done
          if (( ${#sources[@]} != 2 )); then
            echo "expected two platform digests, found ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_VERSION}"
